services:
  minio:
    image: minio/minio:latest
    pull_policy: missing
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Official local image: mongod + mongot in one container so $vectorSearch works.
  # Host: mongodb://fireflies:fireflies@localhost:27017/fireflies?authSource=admin&directConnection=true
  # api service: use the mongodb hostname on the compose network.
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    pull_policy: missing
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: fireflies
      MONGODB_INITDB_ROOT_PASSWORD: fireflies
    volumes:
      - mongo-db:/data/db
      - mongo-configdb:/data/configdb
      - mongo-mongot:/data/mongot

  redis:
    image: redis:7-alpine
    pull_policy: missing
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      MONGODB_URI: mongodb://fireflies:fireflies@mongodb:27017/fireflies?authSource=admin&directConnection=true
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      PORT: "3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: on-failure

volumes:
  minio-data:
  mongo-db:
  mongo-configdb:
  mongo-mongot:
